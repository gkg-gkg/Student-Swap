# Amplify Hosting custom headers (security). Adjust the API / Cognito / Stripe hosts if you use custom domains.
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://js.stripe.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src https://fonts.gstatic.com;
          img-src 'self' data: blob: https://*.stripe.com;
          connect-src 'self' https://*.execute-api.*.amazonaws.com https://cognito-idp.*.amazonaws.com https://*.s3.*.amazonaws.com https://api.stripe.com;
          frame-src https://js.stripe.com https://hooks.stripe.com;
          base-uri 'self'; form-action 'self'; object-src 'none'
